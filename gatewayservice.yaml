server:
  port: 8080

spring:
  application:
    name: gatewayservice

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: lb://productservice
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1

            - id: order-service
              uri: lb://orderservice
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
